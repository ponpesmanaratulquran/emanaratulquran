<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>eManaratulQur'an — Sistem Informasi Pesantren</title>
  <meta name="theme-color" content="#1F8A52">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #0D3B26;
    }
    iframe {
      width: 100%; height: 100vh; border: none; display: block;
    }
    .loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0D3B26 0%, #125C33 50%, #1F8A52 100%);
      color: #fff; font-family: system-ui, sans-serif; z-index: 10;
      flex-direction: column; gap: 16px;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(201,162,74,0.25);
      border-top-color: #C9A24A; border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader.hidden { display: none; }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div style="font-weight:600;font-size:14px;">Memuat aplikasi...</div>
  </div>
  <iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzW-Lj0CiMrCh2qTTIsHCRricsk_Fx5feGohiYUMP1Rkg4majC8-N3ClBrsGfkA9XoIRQ/exec"
    allow="clipboard-write; clipboard-read; fullscreen"
    referrerpolicy="no-referrer-when-downgrade"
    title="eManaratulQur'an">
  </iframe>
  <script>
    var frame = document.getElementById('appFrame');
    var loader = document.getElementById('loader');
    // Sembunyikan loader setelah iframe selesai load
    frame.addEventListener('load', function() {
      setTimeout(function() {
        loader.classList.add('hidden');
      }, 500);
    });
    // Fallback: sembunyikan loader setelah 8 detik (jika load event tidak terpanggil)
    setTimeout(function() {
      loader.classList.add('hidden');
    }, 8000);
  </script>
</body>
</html>
